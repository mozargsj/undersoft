name = "undersoft-contact"
main = "index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://undersoft.pt,https://www.undersoft.pt"
MAIL_FROM = "site@undersoft.pt"

[[send_email]]
name = "EMAIL"

# Segredos (NAO colocar aqui: o repositorio e publico):
#   npx wrangler secret put TURNSTILE_SECRET   # secret key do widget Turnstile
#   npx wrangler secret put MAIL_TO            # destinatario: tem de ser um destino VERIFICADO no Email Routing
#                                               # (o mesmo para onde contacto@undersoft.pt encaminha)