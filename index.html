    <style>
      /* Reload no meio da pagina: esconde ate a posicao ser restaurada (ver useSmoothScroll.js) */
      body { transition: opacity 0.3s ease; }
      /* Fundo do viewport (canvas) escuro desde o 1o paint: o body fica claro (#F7F6F0), mas enquanto o React
         nao monta ele e vazio e o que aparece e este fundo (sem flash claro). */
      html.home { background: #1a1410; }
      html.is-restoring body { opacity: 0; }
    </style>
    <script>
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        var restoring = nav && (nav.type === "reload" || nav.type === "back_forward") && Number(sessionStorage.getItem("undersoft:scrollY")) > 4;
        var fromHash = location.hash.length > 1 && !restoring; // chegada por /#secao (paginas legais)
        if (restoring || fromHash) {
          var root = document.documentElement;
          root.classList.add("is-restoring");
          setTimeout(function () { root.classList.remove("is-restoring"); }, 4000); // seguranca: nunca fica escondido
        }
      } catch (e) {}
    </script>
