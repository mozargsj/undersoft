name: Deploy para Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    # So publica a main: o comando abaixo forca --branch=main, entao um "Run workflow" em outra branch
    # publicaria o codigo DESSA branch em producao. Fora da main, o job nem roda.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        # Sem a site key o widget nao aparece e o Worker recusa o envio: melhor falhar aqui do que publicar um formulario quebrado.
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::A variavel VITE_TURNSTILE_SITE_KEY esta vazia"; exit 1; }
          npm run build
        env:
          # Variaveis do repositorio (Settings > Secrets and variables > Actions > Variables). Ver .env.example.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
      - name: Publicar no Cloudflare Pages
        # Action de terceiros que recebe o token: fixada no commit exato (tag v3.15.0), nao na tag movel.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "4.161.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main explicito: deploy de producao (o job so roda na main, ver "if" acima).
          command: pages deploy dist --project-name=undersoft-pt --branch=main
